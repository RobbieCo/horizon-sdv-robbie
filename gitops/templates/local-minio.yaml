Local developer mode only: MinIO stands in for the GCS artifact bucket.
WorkflowTemplates are unchanged. The Argo Workflows controller is pointed at
this service via artifactRepository.s3 when config.local.enabled is true.
The executor reads horizon-local-minio in the workflow namespace.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: horizon-local-minio
  namespace: {{ .Values.config.namespacePrefix }}argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "4"
type: Opaque
stringData:
  accessKey: horizon-local
  secretKey: horizon-local-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: horizon-local-minio
  namespace: {{ .Values.config.namespacePrefix }}workflows
  annotations:
    argocd.argoproj.io/sync-wave: "4"
type: Opaque
stringData:
  accessKey: horizon-local
  secretKey: horizon-local-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.config.namespacePrefix }}argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # Official minio/minio is no longer anonymously pullable. This is the
          # same MinIO server, published by Bitnami under the legacy namespace.
          image: bitnamilegacy/minio:2025.7.23
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: horizon-local-minio
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-local-minio
                  key: secretKey
            - name: MINIO_DEFAULT_BUCKETS
              value: horizon-artifacts
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.config.namespacePrefix }}argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
{{- end }}
