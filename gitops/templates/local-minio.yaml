Local developer mode only: MinIO stands in for the GCS artifact bucket.
WorkflowTemplates are unchanged. The Argo Workflows controller is pointed at
this service via artifactRepository.s3 when config.local.enabled is true.
The executor reads horizon-local-minio in the workflow namespace.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: horizon-local-minio
  namespace: {{ .Values.config.namespacePrefix }}argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "4"
type: Opaque
stringData:
  accessKey: horizon-local
  secretKey: horizon-local-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: horizon-local-minio
  namespace: {{ .Values.config.namespacePrefix }}workflows
  annotations:
    argocd.argoproj.io/sync-wave: "4"
type: Opaque
stringData:
  accessKey: horizon-local
  secretKey: horizon-local-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.config.namespacePrefix }}argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: horizon-local-minio
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-local-minio
                  key: secretKey
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.config.namespacePrefix }}argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: {{ .Values.config.namespacePrefix }}argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: horizon-local-minio
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-local-minio
                  key: secretKey
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done
              mc mb --ignore-existing local/horizon-artifacts
              echo "bucket ready"
{{- end }}
