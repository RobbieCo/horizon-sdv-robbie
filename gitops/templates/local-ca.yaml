Local developer mode only: distribute the self-signed CA (from terraform/local)
into the namespaces whose Go pods validate TLS to https://<domain> server-side
(horizon-api JWKS, horizon-dev-portal proxy token exchange). SSL_CERT_FILE in
those deployments points at the mounted ca.crt. Not rendered in cloud mode.
*/}}
{{- $caB64 := .Values.config.local.caBundleB64 }}
{{- if $caB64 }}
{{- range $ns := list "horizon-api" "horizon-dev-portal" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.config.local.caConfigMap }}
  namespace: {{ $.Values.config.namespacePrefix }}{{ $ns }}
  annotations:
    # Before the app Deployments (horizon-dev-portal wave 6, horizon-api wave 7).
    argocd.argoproj.io/sync-wave: "0"
binaryData:
  ca.crt: {{ $caB64 }}
{{- end }}
{{- end }}
{{- end }}
