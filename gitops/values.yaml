config:
  name: Horizon SDV
  enableNetworkPolicies: true
  isSubEnvironment: false
  namespacePrefix: ""
  projectID: ""
  storageLocation: ""
  # Node primary subnet CIDRs for kubelet HTTP probes (storage-gcs NetworkPolicy).
  # Overridden by Terraform via root GitOps → MODULE_CONFIG (nodes_range / arm64_nodes_range).
  probeSourceCIDRs:
    - "10.1.0.0/24"
    - "10.2.0.0/24"
  # Helm chart version pins for Argo CD Applications (upstream chart versions / revisions).
  chartVersions:
    keycloak:
      version: "7.1.4"
    postgresql:
      version: "postgresql/17.0.1"
    zookeeper:
      version: "zookeeper/13.8.7"
    kubescape_operator:
      version: "1.29.11"
    mtkconnect:
      version: "v1.13.0"
    argoEvents:
      version: "2.3.2"
      # NATS StatefulSet size for the default EventBus. Use 1 on small/dev clusters (3 needs quorum
      # and enough nodes); if NATS is not Ready, the webhook EventSource often hangs on POST (502 from Horizon API).
      eventBusNATSReplicas: 1
    argo_workflows:
      version: "0.47.4"

  # Horizon platform component versions. Set by Terraform from the repo-root versions.yaml
  # (config.versions.components); empty here so templates render without Terraform.
  versions:
    components:
      horizoncore: ""

  # Developer Portal (SPA + proxy): Gateway path, Keycloak, in-cluster URL overrides — not a chart version.
  horizonDevelopmentPortal:
    # HTTP path prefix (Gateway HTTPRoute, Keycloak redirect URIs, portal ConfigMap PUBLIC_PATH).
    publicPath: "/developer-portal"
    # Must match Keycloak deployment (realm / http path).
    keycloakRealm: "horizon"
    keycloakHttpPathPrefix: "/auth"
    # OAuth public client id (Keycloak client + config.js).
    keycloakClientId: "horizon-dev-portal"
    # Confidential client for the Go proxy (token exchange to Horizon API); must exist in Keycloak.
    horizonApiCiClientId: "horizon-api-ci"
    # Optional in-cluster service URLs (empty = defaults from namespace prefix + standard Service names).
    horizonApiInternalBaseUrl: ""
    moduleManagerInternalBaseUrl: ""

  # Config Connector (cluster-mode ConfigConnector CR and webhook monitor in
  # templates/config-connector-init.yaml; operator in gitops/apps/configconnector-operator).
  configConnector:
    # Cluster-mode KCC: no per-namespace ConfigConnectorContext
    # (see ConfigConnector CR in templates/config-connector-init.yaml).
    # Legacy list retained for docs / future namespaced-mode only; not rendered by Helm today.
    namespaces:
      - gcp
      - sample-module-hello
      - sample-hard-module-hello
      - sample-soft-module-hello

    # Centralized KCC webhook cert monitor:
    # - thresholdSeconds: restart cnrm-webhook-manager when cert expires within this window.
    # - cooldownSeconds: minimum interval between automatic restarts.
    webhookMonitor:
      thresholdSeconds: 2592000   # 30 days
      cooldownSeconds: 86400      # 24 hours

  workloads:
    android:
      helm:
        version: '5.9.63'
      # Set by Terraform on live clusters (MODULE_CONFIG for Module Manager module workloads-android).
      url: ""
      branch: ""

  # Local developer prototype mode (terraform/local + Rancher/Docker Desktop).
  # DEFAULT false => production/cloud behaviour is completely unchanged; none of the
  # local-only branches below render. This is the SINGLE switch that the local ArgoCD
  # Application sets to true (config.local.enabled). There is no separate gitops copy.
  local:
    enabled: false
    # Public base URL + OIDC issuer for the desktop cluster (https://horizon.local).
    platformUrl: ""
    issuerUrl: ""
    # ingress-nginx replaces the GKE Gateway for the in-scope services.
    ingressClassName: "nginx"
    # Empty => rely on the ingress-nginx controller default-ssl-certificate
    # (ingress-nginx/horizon-local-tls created by terraform/local).
    tlsSecretName: ""
    # Services kept in the minimal local stack (informational; gating is per-template).
    enabledServices: []
    # Module Manager + its ModuleCatalog are IDENTICAL to production (no trimming), so
    # production MM can be developed on the local cluster. The modules' cloud (KCC /
    # *.cnrm.cloud.google.com) resources are stubbed at the cluster level by
    # bootstrap-local.sh (inert CRDs, no controller) plus an ArgoCD health override in
    # terraform/local/argocd.tf. See docs/local_dev_prototype_proposal.md.
    # Locally built images are loaded straight into the desktop image store.
    imagePullPolicy: "IfNotPresent"
    # Keep PostgreSQL data across restarts (PVC) vs emptyDir.
    postgresqlPersistence: true
    # Archiving/MinIO disabled locally (no cloud bucket).
    argoWorkflowsArchive: false
    # keycloak-post realm/client seed jobs to run locally.
    keycloakPostJobs: []
    # ConfigMap (per namespace) holding the self-signed CA so pods trust https://horizon.local.
    caConfigMap: "horizon-local-ca"
    # Base64-encoded CA certificate (PEM) injected by terraform/local. Used by the
    # local-only templates/local-ca.yaml to create the CA ConfigMap in app namespaces.
    caBundleB64: ""
    # Developer login users created by the local-only finisher Job
    # (templates/local-dev-users.yaml). Each: {username, groups: [realm group names]}.
    # Password is the shared dev password (keycloak-initial-creds), set permanent.
    devUsers: []
spec:
  destination:
    server: https://kubernetes.default.svc